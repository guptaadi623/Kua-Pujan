<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kua Pujan Invitation | Advait Gupta</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c5a059;
            --dark-green: #1a3c34;
            --cream: #fdfaf5;
            --wood: #8b4513;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--cream);
            color: var(--dark-green);
            text-align: center;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* 3. Parallax/Fade-In Animation */
        .reveal { opacity: 0; transform: translateY(30px); transition: all 1s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        /* Hero Section */
        .hero {
            height: 80vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(rgba(255,255,255,0.7), rgba(255,255,255,0.7)), 
                        url('https://images.unsplash.com/photo-1582555172866-f73bb12a2ab3?q=80&w=1920') center/cover fixed;
            padding: 20px;
            border-bottom: 5px solid var(--gold);
        }

        h1 { font-family: 'Cinzel', serif; font-size: 3rem; color: var(--wood); margin: 10px 0; }
        .sub-gold { color: var(--gold); font-weight: 600; letter-spacing: 3px; text-transform: uppercase; }

        /* Video Section */
        .video-section { padding: 40px 20px; background: white; }
        .video-container {
            max-width: 350px; margin: 0 auto;
            border-radius: 15px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 4px solid var(--gold);
        }
        video { width: 100%; display: block; }

        /* Timer */
        .timer-container {
            background: var(--dark-green); color: white;
            padding: 40px 10px; display: flex; justify-content: center; gap: 20px;
        }
        .timer-number { display: block; font-size: 2.2rem; color: var(--gold); font-family: 'Cinzel', serif; }
