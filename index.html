<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kua Pujan Invitation | Advait Gupta</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c5a059;
            --dark-green: #1a3c34;
            --cream: #fdfaf5;
            --wood: #8b4513;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--cream);
            color: var(--dark-green);
            text-align: center;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* --- LOADING SCREEN --- */
        #loader-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--cream); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10001;
            transition: opacity 0.8s ease-out, visibility 0.8s;
        }
        .loader-mandala { font-size: 60px; color: var(--gold); animation: rotateMandala 4s linear infinite; }
        @keyframes rotateMandala { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .loader-text { margin-top: 20px; font-family: 'Cinzel', serif; color: var(--wood); letter-spacing: 3px; font-size: 0.8rem; }
        .loader-hidden { opacity: 0; visibility: hidden; }

        /* --- VIRTUAL DOOR ANIMATION --- */
        #door-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; display: flex; cursor: pointer;
        }
        .door {
            width: 50%; height: 100%;
            background: var(--wood) url('still1.jpg') center/cover;
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--gold);
        }
        .door-left { border-right: none; }
        .door-right { border-left: none; }
        #door-wrapper.open .door-left { transform: translateX(-100%); }
        #door-wrapper.open .door-right { transform: translateX(100%); }
        .enter-text {
            position: absolute; color: white; font-family: 'Cinzel';
            background: rgba(0,0,0,0.6); padding: 15px 30px; 
            border: 1px solid var(--gold); letter-spacing: 2px;
            transition: opacity 0.5s ease;
        }
        .text-hidden { opacity: 0; pointer-events: none; }

        /* --- DECORATIVE DIVIDER --- */
        .divider { display: flex; align-items: center; justify-content: center; margin: 25px 0; }
        .divider::before, .divider::after {
            content: ""; flex: 1; height: 1px;
            background: linear-gradient(to right, transparent, var(--gold), transparent);
            max-width: 120px;
        }
        .divider-icon { font-size: 28px; margin: 0 15px; filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.2)); }

        /* --- UI ELEMENTS --- */
